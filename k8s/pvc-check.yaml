apiVersion: v1
kind: Pod
metadata:
  name: pvc-check
  namespace: ml-training
spec:
  restartPolicy: Never
  containers:
    - name: pvc-check
      image: busybox:1.36
      command: ["sleep", "300"]
      volumeMounts:
        - name: cp
          mountPath: /checkpoints
  volumes:
    - name: cp
      persistentVolumeClaim:
        claimName: checkpoints-pvc
